name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch GitHub/agent-browser behaviour drift

jobs:
  local:
    name: Unit, contract, and local browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install agent-browser and ffprobe (external tools, not package dependencies)
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm verify

  github:
    name: Live GitHub attachment and rendering smoke
    # Fork PRs get a read-only token and cannot edit the fixture PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          npm install -g agent-browser
          agent-browser install --with-deps
      - run: pnpm verify:github
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_GITHUB_MUTATION: "1"
          FIXTURE_REPO: ${{ github.repository }}
